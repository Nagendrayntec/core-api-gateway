apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: core-redirect-https@kubernetescrd,core-strip-identity-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: api-dev.yntec.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: core-api-gateway
            port:
              number: 8080
  tls:
  - hosts:
    - api-dev.yntec.in
    secretName: api-dev-tls-core
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: core-redirect-https@kubernetescrd,core-strip-identity-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: idp-dev.yntec.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: core-api-gateway
            port:
              number: 8080
  tls:
  - hosts:
    - idp-dev.yntec.in
    secretName: idp-dev-tls-core
