# Pipeline gates (SOC 2 finding F-14; static analysis and the destructive-SQL check added for ISO 27001 A.8.28/A.8.32). Every push and pull request must pass them before it can be merged or deployed:
#   1. no secret committed (gitleaks, the whole history of the change),
#   2. no HIGH/CRITICAL vulnerability with a fix available, in dependencies, the source tree or the Dockerfile (Trivy),
#   3. the unit tests, including the guards that fail the build on an endpoint without @PreAuthorize, an identity
#      header parameter or an edited migration.
# Docker-based tests (Testcontainers) are skipped by the runner as before. Uses the same GitHub Packages secret as
# the deploy workflow (GH_PKG_READ_TOKEN).
name: Security gates
on:
  push:
    branches: [Dev, Dev_token, main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  vulnerabilities:
    name: Dependency and file-system scan
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (fs)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.56.2 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  tests:
    name: Unit tests and guards
    runs-on: [self-hosted, Linux, X64, gcp]
    env:
      GH_PKG_TOKEN: ${{ secrets.GH_PKG_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Maven auth for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>infoyntec</username>
                <password>${env.GH_PKG_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          overwrite-settings: false
      - name: mvn test
        run: mvn -B test

  static-analysis:
    name: Static code analysis (Semgrep)
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        # ISO 27001 A.8.28 / A.8.29, SOC 2 CC7.1: secure-coding rules for every language in the repository. Fails on
        # ERROR-severity findings only, so it can be switched on without a backlog; lower the bar with --severity
        # WARNING once the first findings are triaged. Rules are fetched from the Semgrep registry at run time.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.97.0 semgrep scan \
            --config p/security-audit --config p/owasp-top-ten --config p/secrets \
            --severity ERROR --error --metrics=off --exclude target --exclude node_modules

  destructive-sql:
    name: Destructive SQL check
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: No new DROP / TRUNCATE / unconditional DELETE without a review note
        # SOC 2 F-20, ISO 27001 A.8.32: a migration that drops or wipes data needs a written reviewer note in the file:
        #   -- destructive-change-reviewed: <who>, <date>, <why it is safe>
        # Files that already contained such statements when this check was added are listed in
        # .github/destructive-sql-allowlist.txt (applied migrations must never be edited).
        shell: bash
        run: |
          allow=.github/destructive-sql-allowlist.txt
          fail=0
          while IFS= read -r f; do
            grep -qiE '^\s*(DROP\s+(TABLE|SCHEMA|DATABASE)|TRUNCATE|DELETE\s+FROM\s+[^ ]+\s*;)|ALTER\s+TABLE.*DROP\s+COLUMN' "$f" || continue
            grep -q 'destructive-change-reviewed:' "$f" && continue
            [ -f "$allow" ] && grep -qxF "$f" "$allow" && continue
            echo "::error file=$f::destructive SQL without a '-- destructive-change-reviewed: <who>, <date>, <why>' line"
            fail=1
          done < <(git ls-files '*.sql')
          exit $fail
